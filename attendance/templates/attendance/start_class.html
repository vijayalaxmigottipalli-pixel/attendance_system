<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Start Class</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0f172a;
            min-height: 100vh;
        }
        .card-glow {
            box-shadow:
                0 0 35px 6px rgba(124, 58, 237, 0.35),
                0 0 65px 12px rgba(30, 64, 175, 0.25);
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6">

    <div class="card-glow bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl p-8 max-w-md w-full">

        <h1 class="text-3xl font-bold text-white mb-3 text-center">
            🎓 Start Class
        </h1>

        <p class="text-indigo-200 mb-8 text-center">
            Select the class details before starting attendance.
        </p>

        {% if error %}
            <div class="bg-red-500/80 text-white rounded-lg p-3 mb-5 text-sm">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" class="space-y-5">

            {% csrf_token %}

            <!-- Class -->
            <div>
                <label class="block text-white font-semibold mb-2">
                    Class / Section
                </label>

                <select name="class_name"
                        required
                        class="w-full px-4 py-3 rounded-xl bg-gray-800 text-white border-2 border-gray-600 focus:outline-none focus:ring-2 focus:ring-purple-300">

                    <option value="">Select Class</option>
                    <option value="CSE-A">CSE-A</option>
                    <option value="CSE-B">CSE-B</option>
                    <option value="CSE-C">CSE-C</option>
                    <option value="ECE-A">ECE-A</option>
                    <option value="ECE-B">ECE-B</option>
                    <option value="EEE-A">EEE-A</option>
                    <option value="MECH-A">MECH-A</option>

                </select>
            </div>


            <!-- Subject -->
            <div>
                <label class="block text-white font-semibold mb-2">
                    Subject
                </label>

                <input type="text"
                       name="subject"
                       placeholder="Example: DBMS"
                       required
                       class="w-full px-4 py-3 rounded-xl bg-gray-800 text-white placeholder-gray-400 border-2 border-gray-600 focus:outline-none focus:ring-2 focus:ring-purple-300">
            </div>


            <!-- Room -->
            <div>
                <label class="block text-white font-semibold mb-2">
                    Block / Room
                </label>

                <input type="text"
                       name="room"
                       placeholder="Example: Block A - 201"
                       required
                       class="w-full px-4 py-3 rounded-xl bg-gray-800 text-white placeholder-gray-400 border-2 border-gray-600 focus:outline-none focus:ring-2 focus:ring-purple-300">
            </div>


            <!-- Start -->
            <button type="submit"
                    class="w-full bg-white text-purple-700 font-bold py-3 px-6 rounded-xl hover:bg-purple-50 transition shadow-lg">
                🚀 Start Attendance Session
            </button>

        </form>

        <a href="/teacher/dashboard/"
           class="block mt-5 text-indigo-200 hover:text-white text-center">
            ← Back to Dashboard
        </a>

    </div>

</body>
</html>
