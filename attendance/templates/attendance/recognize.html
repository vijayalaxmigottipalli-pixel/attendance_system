<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #0f172a;
            min-height: 100vh;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: rise 0.5s ease forwards; }
        .card-glow {
            box-shadow:
                0 0 35px 6px rgba(124, 58, 237, 0.35),
                0 0 65px 12px rgba(30, 64, 175, 0.25);
        }

        @keyframes pulseOnce {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        #status-banner.granted { animation: pulseOnce 0.4s ease; }

        #neuralCanvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .fade-in, #status-banner.granted { animation: none !important; }
        }
    </style>
</head>
<body class="min-h-screen relative">
    <canvas id="neuralCanvas"></canvas>

    
    <!-- Nav -->
<nav class="bg-gray-900/80 backdrop-blur sticky top-0 z-10 relative">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3 grid grid-cols-3 items-center">

        <!-- Back button -->
        <button onclick="history.back()"
                class="text-indigo-200 hover:text-white transition flex items-center gap-1 text-sm justify-self-start">

            <svg xmlns="http://www.w3.org/2000/svg"
                 class="h-4 w-4"
                 viewBox="0 0 20 20"
                 fill="currentColor">

                <path fill-rule="evenodd"
                      d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 111.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                      clip-rule="evenodd" />
            </svg>

            Back
        </button>

        <!-- Center title -->
        <a href="/"
           class="text-white font-bold text-2xl sm:text-3xl tracking-tight text-center">
            Attendance System
        </a>

        <!-- Empty right side -->
        <div></div>

    </div>
</nav>

    <div class="max-w-xl mx-auto px-4 sm:px-6 py-10 sm:py-16 relative z-10">
        <div class="card-glow bg-white/10 backdrop-blur-xl border border-white/10 rounded-2xl p-6 sm:p-10 fade-in text-center">

            <h1 class="text-2xl sm:text-3xl font-bold text-white mb-1">Mark Attendance</h1>
            <p class="text-indigo-50 text-sm mb-6">Stand in front of the camera to check in.</p>

            <!-- Mode toggle -->
            <div class="flex justify-center mb-5">
                <div class="inline-flex bg-white/10 backdrop-blur-md rounded-xl p-1 text-sm font-semibold w-full sm:w-auto border border-white/20">
                    <button id="mode-multiple" onclick="setMode('multiple')"
                            class="flex-1 sm:flex-none px-4 py-2 rounded-lg transition bg-white text-purple-800">
                        Multiple Access
                    </button>
                    <button id="mode-single" onclick="setMode('single')"
                            class="flex-1 sm:flex-none px-4 py-2 rounded-lg transition text-white/80">
                        Select yourself
                    </button>
                </div>
            </div>

            <div class="rounded-xl overflow-hidden border-4 border-white/20 inline-block">
                <video id="video" autoplay muted playsinline class="block w-full max-w-[420px] h-auto"></video>
            </div>

            <div id="status-banner" class="waiting mt-5 rounded-xl px-5 py-4 font-bold text-lg flex items-center justify-center gap-2 min-h-[3rem] transition-colors bg-white/10 text-white">
                <span class="text-2xl leading-none" id="status-icon"></span>
                <span id="status-text">Starting camera...</span>
            </div>

            <div id="checkin-list" class="mt-8 text-left">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-indigo-50 mb-2">Checked in today</h2>
                <div id="checkin-items" class="space-y-2"></div>
            </div>

            <canvas id="canvas" style="display:none;"></canvas>
        </div>
    </div>

    <script>
        const neuralCanvas = document.getElementById('neuralCanvas');
        const neuralCtx = neuralCanvas.getContext('2d');
        let nWidth, nHeight, nParticles;

        const N_PARTICLE_COUNT = 70;
        const N_MAX_DIST = 130;
        const N_SPEED = 0.35;

        function nResize() {
            nWidth = neuralCanvas.width = window.innerWidth;
            nHeight = neuralCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', nResize);
        nResize();

        nParticles = Array.from({ length: N_PARTICLE_COUNT }, () => ({
            x: Math.random() * nWidth,
            y: Math.random() * nHeight,
            vx: (Math.random() - 0.5) * N_SPEED,
            vy: (Math.random() - 0.5) * N_SPEED,
        }));

        const nReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function nDrawFrame() {
            neuralCtx.clearRect(0, 0, nWidth, nHeight);

            for (const p of nParticles) {
                if (!nReducedMotion) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > nWidth) p.vx *= -1;
                    if (p.y < 0 || p.y > nHeight) p.vy *= -1;
                }
                neuralCtx.beginPath();
                neuralCtx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                neuralCtx.fillStyle = 'rgba(255,255,255,0.65)';
                neuralCtx.fill();
            }

            for (let i = 0; i < nParticles.length; i++) {
                for (let j = i + 1; j < nParticles.length; j++) {
                    const a = nParticles[i], b = nParticles[j];
                    const dx = a.x - b.x, dy = a.y - b.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < N_MAX_DIST) {
                        neuralCtx.beginPath();
                        neuralCtx.moveTo(a.x, a.y);
                        neuralCtx.lineTo(b.x, b.y);
                        neuralCtx.strokeStyle = `rgba(255,255,255,${0.25 * (1 - dist / N_MAX_DIST)})`;
                        neuralCtx.lineWidth = 1;
                        neuralCtx.stroke();
                    }
                }
            }

            if (!nReducedMotion) requestAnimationFrame(nDrawFrame);
        }
        nDrawFrame();
    </script>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const banner = document.getElementById('status-banner');
        const statusIcon = document.getElementById('status-icon');
        const statusText = document.getElementById('status-text');
        const checkinList = document.getElementById('checkin-list');
        const checkinItems = document.getElementById('checkin-items');
        const modeMultipleBtn = document.getElementById('mode-multiple');
        const modeSingleBtn = document.getElementById('mode-single');

        const alreadyMarkedIds = new Set();
        const SEND_INTERVAL_MS = 1500;
        const RESET_DELAY_MS = 3000;

        let resetTimer = null;
        let pollTimer = null;
        let requestInFlight = false;
        let mode = 'multiple';

        // Tailwind-based color classes per banner state
        const BANNER_STYLES = {
            waiting: 'bg-white/10 text-white',
            granted: 'bg-green-500 text-white',
            already: 'bg-amber-500 text-white',
            denied: 'bg-red-500 text-white',
        };

        function setMode(newMode) {
            mode = newMode;
            const activeClasses = ['bg-white', 'text-purple-800'];
            const inactiveClasses = ['text-white/80'];

            if (newMode === 'multiple') {
                modeMultipleBtn.classList.add(...activeClasses);
                modeMultipleBtn.classList.remove(...inactiveClasses);
                modeSingleBtn.classList.remove(...activeClasses);
                modeSingleBtn.classList.add(...inactiveClasses);
                checkinList.classList.remove('hidden');
            } else {
                modeSingleBtn.classList.add(...activeClasses);
                modeSingleBtn.classList.remove(...inactiveClasses);
                modeMultipleBtn.classList.remove(...activeClasses);
                modeMultipleBtn.classList.add(...inactiveClasses);
                // Single-person mode: this is a personal check-in screen,
                // so hide the shared roster list — just show your own result.
                checkinList.classList.add('hidden');
            }
        }

        function getCsrfCookie() {
            const match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : '';
        }

        function setBanner(state, icon, html) {
            banner.className = state + ' mt-5 rounded-xl px-5 py-4 font-bold text-lg flex items-center justify-center gap-2 min-h-[3rem] transition-colors ' + BANNER_STYLES[state];
            statusIcon.textContent = icon;
            statusText.innerHTML = html;

            clearTimeout(resetTimer);
            if (state !== 'waiting') {
                resetTimer = setTimeout(() => {
                    setBanner('waiting', '', 'Looking for a face...');
                }, RESET_DELAY_MS);
            }
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                setBanner('waiting', '', 'Camera ready — looking for faces...');
                scheduleNextCapture();
            } catch (err) {
                setBanner('denied', '⚠️', 'Could not access camera: ' + err.message);
            }
        }

        function scheduleNextCapture() {
            clearTimeout(pollTimer);
            pollTimer = setTimeout(captureAndSend, SEND_INTERVAL_MS);
        }

        function captureAndSend() {
            // Skip this tick if a previous request is still in flight —
            // prevents a burst of overlapping requests piling up on the
            // dev server if one response is slow to come back.
            if (requestInFlight) {
                scheduleNextCapture();
                return;
            }

            // Both modes auto-recognize from the camera directly — no name
            // picker needed. The only difference is Multiple Access keeps
            // building a shared roster list; Select Yourself is a personal
            // check-in view (see setMode above) and only asks the backend
            // to match a single (largest) face.
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.8);

            requestInFlight = true;

            fetch('/mark_attendance/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrfCookie(),
                },
                body: JSON.stringify({ image: imageData, mode: mode }),
            })
            .then(res => res.json())
            .then(handleResult)
            .catch(err => {
                setBanner('denied', '⚠️', 'Error contacting server: ' + err);
            })
            .finally(() => {
                requestInFlight = false;
                scheduleNextCapture();
            });
        }

        function handleResult(data) {
            const isSettling = !banner.className.includes('bg-white/10');

            switch (data.status) {
                case 'no_face':
                    if (!isSettling) setBanner('waiting', '', 'Looking for a face...');
                    break;
                case 'no_trained_students':
                    setBanner('denied', '⚠️', data.message || 'No trained students yet — register and capture faces first.');
                    break;
                case 'ok':
                    handleFaceResults(data.results || [], isSettling);
                    break;
                case 'error':
                    setBanner('denied', '⚠️', 'Error: ' + data.message);
                    break;
                default:
                    break;
            }
        }

        function handleFaceResults(results, isSettling) {
            if (!results.length) return;

            // Every recognized face (new or already-checked-in) gets added
            // to the roster list, not just whichever the banner highlights.
            results.forEach(r => {
                if (r.status === 'marked') addCheckin(r, false);
                else if (r.status === 'already_marked') addCheckin(r, true);
            });

            // Banner shows the single most notable result this tick:
            // a brand-new check-in beats "already checked in", which
            // beats "face not recognized".
            const primary =
                results.find(r => r.status === 'marked') ||
                results.find(r => r.status === 'already_marked') ||
                results.find(r => r.status === 'unrecognized');

            if (!primary) return;

            if (primary.status === 'marked') {
                setBanner(
                    'granted',
                    '✅',
                    `Access Granted<span class="block font-normal text-sm mt-0.5">${primary.student_name} (${primary.roll_number}) — ${primary.time}</span>`
                );
            } else if (primary.status === 'already_marked') {
                setBanner(
                    'already',
                    '⏱️',
                    `Already Checked In<span class="block font-normal text-sm mt-0.5">${primary.student_name} (${primary.roll_number}) — ${primary.time}</span>`
                );
            } else if (primary.status === 'unrecognized' && !isSettling) {
                setBanner('denied', '❌', 'Face not recognized.');
            }
        }

        function addCheckin(data, alreadyKnown) {
            if (alreadyMarkedIds.has(data.student_id)) {
                return;
            }
            alreadyMarkedIds.add(data.student_id);

            const item = document.createElement('div');
            item.className = 'bg-white/10 backdrop-blur-md border-l-4 rounded-lg px-4 py-2 flex justify-between items-center ' +
                (alreadyKnown ? 'border-gray-400 text-white/60' : 'border-green-500 text-white');
            item.innerHTML = `
                <span class="font-semibold">${data.student_name} (${data.roll_number})</span>
                <span class="text-sm text-white/50">${data.time}</span>
            `;
            checkinItems.prepend(item);
        }

        setMode('multiple');
        startCamera();
    </script>
</body>
</html>
